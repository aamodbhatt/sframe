[workspace]
resolver = "2"
members = ["crates/smallframe-core", "crates/smallframe-cli", "crates/smallframe-phase0-wasm", "crates/smallframe-server-verifier"]

[profile.release.package.smallframe-phase0-wasm]
opt-level = "s"
strip = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

# Server package validation prioritizes execution cost; browser builds keep release.
[profile.server-verifier]
inherits = "release"
opt-level = "s"
