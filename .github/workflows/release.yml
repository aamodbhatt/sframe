name: Release Matrix

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@439cf607258077187679211f12aa6f19af4a0af7 # master
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Build release CLI archive
        run: node scripts/build-release-cli.mjs

      - name: Upload Release Archive
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba811e # v4.6.1
        with:
          name: smallframe-macos-arm64
          path: dist/smallframe-macos-arm64.tar.gz
