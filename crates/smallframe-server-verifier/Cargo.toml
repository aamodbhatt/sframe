[package]
name = "smallframe-server-verifier"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
base64ct = { version = "=1.8.3", features = ["alloc"] }
serde_json = "=1.0.151"
smallframe-core = { path = "../smallframe-core", default-features = false }
wasm-bindgen = "=0.2.127"
