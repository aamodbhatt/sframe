[package]
name = "smallframe-cli"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[dependencies]
aes-gcm = { version = "=0.11.1", features = ["getrandom"] }
argon2 = "=0.5.3"
base64ct = { version = "=1.8.3", features = ["alloc"] }
clap = { version = "=4.6.6", features = ["derive"] }
ed25519-dalek = { version = "=2.2.0", features = ["pkcs8", "rand_core", "zeroize"] }
keyring = "=4.1.6"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
rpassword = "=7.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = "=1.0.151"
smallframe-core = { path = "../smallframe-core" }
sha2 = "=0.10.9"
thiserror = "=2.0.20"
zeroize = "=1.9.0"
