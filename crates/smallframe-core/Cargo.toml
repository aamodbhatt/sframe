[package]
name = "smallframe-core"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["full-schema"]
full-schema = ["dep:jsonschema"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
base64ct = { version = "=1.8.3", features = ["alloc"] }
ed25519-dalek = { version = "=2.2.0", features = ["pkcs8", "rand_core", "zeroize"] }
jsonschema = { version = "=0.49.9", default-features = false, optional = true }
oxc_allocator = "=0.147.0"
oxc_ast = "=0.143.0"
oxc_ast_visit = "=0.143.0"
oxc_parser = "=0.143.0"
oxc_span = "=0.143.0"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.20"
unicode-normalization = "=0.1.25"
automerge = "=0.11.0"
wasm-bindgen = { version = "=0.2.127", optional = true }
zip = { version = "=8.6.0", default-features = false }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom_04 = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
