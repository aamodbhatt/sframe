<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smallframe local evidence MVP</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <script src="/fixture-module.js"></script>
  </head>
  <body>
    <a class="skip" href="#app-host">Skip to app</a>
    <header class="chrome" aria-label="Smallframe controller">
      <strong>Smallframe</strong><span aria-hidden="true"> · </span><span>personal local workspace</span>
      <span id="build" class="build">Build pending</span>
    </header>
    <main>
      <h1>Decision Board</h1>
      <p id="status" role="status" aria-live="polite">Starting local proof…</p>
      <section id="app-host" aria-label="App workspace"></section>
    </main>
    <script src="/main.js"></script>
  </body>
</html>
